<body>
<h1>Customer Information Form</h1>
<form action = "#" method="get">    
<label for="name">Name:</label>
<input type="text" id="name" name="name" required><br><br>
 
        <label for="email">Email:</label>
<input type="email" id="email" email="email" required><br><br>
 
        <label for="phone">Phone:</label>
<input type="phone" id="phone" phone="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890" required><br><br>
 
        <label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob" required><br><br>     
 
        <label for="jom">Joining Month:</label>
<input type="month" id="jom" name="email" required><br><br>
 
        <label for="ns">Number of year of service:</label>
<input type="number" id="ns" name="ns" required><br><br>
<div>
    <select name="Country" id="Country"
       <option>India</option>
       <option>Australia</option>
       <option>Germany</option>
       <option>africa</option>
       <option>Brazil</option>
    </select>
    <br><br>

</div>
 
        <input type="submit" value="Submit">
</form>
